name: Build topology

on:
  push:
    branches:
      - clan
    paths-ignore:
      - "docs/topology/**"

permissions:
  contents: write
  actions: write

jobs:
  topology:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: cachix/install-nix-action@v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-topology-${{ hashFiles('flake.lock', 'flake.nix', 'inventory.json', 'modules/**/*.nix', 'machines/**/*.nix', 'modules/topology/assets/**') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-topology-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: |
            nix-${{ runner.os }}-topology-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Build topology images
        run: nix build .#packages.x86_64-linux.topology-images

      - name: Copy topology output
        run: |
          mkdir -p docs/topology
          rm -rf docs/topology/*
          cp -aL result/. docs/topology/

      - name: Commit topology output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/topology
          git diff --cached --quiet || git commit -m "topology: update rendered images"
          git push
