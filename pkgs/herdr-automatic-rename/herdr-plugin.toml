id = "herdr-automatic-rename"
name = "Herdr Automatic Rename"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Automatic [N] tab names and display-only workspace/agent jump indexes"
platforms = ["linux", "macos"]

[[startup]]
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "workspace.closed"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "workspace.renamed"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "workspace.updated"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "workspace.moved"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "workspace.reordered"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "worktree.created"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "worktree.opened"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "worktree.removed"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "tab.created"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "tab.closed"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "tab.renamed"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "tab.moved"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "tab.focused"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.created"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.closed"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.exited"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.focused"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.moved"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-automatic-rename", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-automatic-rename", "event"]

[[actions]]
id = "reset"
title = "Reset tab to automatic naming"
contexts = ["global"]
command = ["bin/herdr-automatic-rename", "reset"]
