id = "herdr-autoname"
name = "Herdr Autoname"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Automatic [N] tab names and server-local workspace/agent indexes"
platforms = ["linux", "macos"]

[[startup]]
command = ["bin/herdr-autoname", "start"]

[[actions]]
id = "reset"
title = "Reset tab to automatic naming"
contexts = ["global"]
command = ["bin/herdr-autoname", "reset"]
